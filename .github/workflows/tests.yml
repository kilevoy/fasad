name: tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "vitest.config.ts"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Run tests
        run: npm test
